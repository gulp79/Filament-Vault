# Nuitka compilation configuration for Filament Vault
# Single standalone Windows Executable build with PySide6 plugin

# Command syntax:
# python -m nuitka --standalone --onefile --enable-plugin=pyside6 --windows-console-mode=disable --include-package=filament_vault --output-filename=FilamentVault.exe src/filament_vault/__main__.py

[nuitka]
standalone = true
onefile = true
enable-plugins = pyside6
windows-console-mode = disable
include-package = filament_vault
output-filename = FilamentVault.exe
output-dir = dist
