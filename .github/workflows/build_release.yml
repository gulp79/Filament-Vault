name: Build & Release Filament Vault

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install Build Tools and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka zstandard ordered-set

      - name: Run Test Suite
        env:
          PYTHONPATH: src
        run: |
          pip install pytest
          pytest tests/

      - name: Compile Windows Executable with Nuitka
        env:
            PYTHONPATH: src
        run: |
          python -m nuitka --standalone --onefile --assume-yes-for-downloads --enable-plugin=pyside6 --windows-console-mode=disable --include-package=filament_vault --output-filename=FilamentVault.exe --output-dir=dist src/filament_vault/__main__.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilamentVault-Windows
          path: dist/FilamentVault.exe

      - name: Create GitHub Release and Publish Binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FilamentVault.exe
          name: "Filament Vault ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
